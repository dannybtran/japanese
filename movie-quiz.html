<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Phrase Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 2rem;
            line-height: 1.6;
        }
        
        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .movie-title {
            text-align: center;
            margin-bottom: 2rem;
            color: #999;
            font-size: 14px;
        }
        
        .score-display {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        
        .score-card {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        .score-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .score-number {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }
        
        .progress-section {
            margin-bottom: 1.5rem;
        }
        
        .progress-bar {
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .phrase-display {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .japanese-phrase {
            font-size: 48px;
            font-weight: 500;
            color: #333;
            text-align: center;
        }
        
        .hiragana {
            color: #10b981;
        }
        
        .katakana {
            color: #3b82f6;
        }
        
        .kanji {
            color: #ef4444;
            position: relative;
            cursor: help;
            border-bottom: 2px dotted #ef4444;
        }
        
        .kanji[data-hiragana]::after {
            content: attr(data-hiragana);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #10b981;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        
        .kanji[data-hiragana]::before {
            content: '';
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #333;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        
        .kanji[data-hiragana]:hover::after,
        .kanji[data-hiragana]:hover::before {
            opacity: 1;
        }
        
        .feedback {
            text-align: center;
            height: 24px;
            margin-bottom: 1rem;
            font-size: 14px;
            font-weight: 500;
            min-height: 24px;
        }
        
        .feedback.correct-msg {
            color: #10b981;
        }
        
        .feedback.incorrect-msg {
            color: #ef4444;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        
        .option-btn {
            padding: 12px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            text-align: left;
            transition: all 0.2s;
        }
        
        .option-btn:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .option-btn.correct {
            background: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }
        
        .option-btn.incorrect {
            background: #fee2e2;
            color: #7f1d1d;
            border-color: #ef4444;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .action-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .action-btns button {
            padding: 10px 24px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .action-btns button:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .action-btns button:active {
            transform: scale(0.98);
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }
        
        .error {
            text-align: center;
            padding: 2rem;
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Movie Phrase Quiz</h1>
        <div class="movie-title" id="movie-title">Loading...</div>
        
        <div id="loading-section" class="loading">
            Loading quiz data...
        </div>
        
        <div id="error-section" class="error" style="display: none;"></div>
        
        <div id="quiz-section" style="display: none;">
            <div class="score-display">
                <div class="score-card">
                    <div class="score-label">Correct</div>
                    <div class="score-number" id="correct-score">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Incorrect</div>
                    <div class="score-number" id="incorrect-score">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Accuracy</div>
                    <div class="score-number" id="accuracy-score">—</div>
                </div>
            </div>
            
            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
                <div class="progress-text" id="progress-text">1/10</div>
            </div>
            
            <div class="phrase-display">
                <div class="japanese-phrase" id="phrase"></div>
            </div>
            
            <div class="feedback" id="feedback"></div>
            
            <div class="options" id="options-container"></div>
            
            <div class="action-btns">
                <button onclick="nextQuestion()">Next phrase</button>
                <button onclick="resetQuiz()">Reset</button>
            </div>
        </div>
    </div>
    
    <script>
        let quizData = null;
        let score = { correct: 0, incorrect: 0 };
        let shuffledPhrases = [];
        let currentIndex = 0;
        let currentPhrase = null;
        let answered = false;
        
        function getMovieFile() {
            const params = new URLSearchParams(window.location.search);
            return params.get('file') || 'totoro.json';
        }
        
        function colorCodeKana(text, kanjiMap = {}) {
            let html = '';
            for (let char of text) {
                const code = char.charCodeAt(0);
                let className = '';
                let dataAttr = '';
                
                // Hiragana: U+3040 to U+309F
                if (code >= 0x3040 && code <= 0x309F) {
                    className = 'hiragana';
                }
                // Katakana: U+30A0 to U+30FF
                else if (code >= 0x30A0 && code <= 0x30FF) {
                    className = 'katakana';
                }
                // Kanji: U+4E00 to U+9FFF (and other ranges)
                else if ((code >= 0x4E00 && code <= 0x9FFF) || 
                         (code >= 0x3400 && code <= 0x4DBF) ||
                         (code >= 0x20000 && code <= 0x2A6DF)) {
                    className = 'kanji';
                    if (kanjiMap[char]) {
                        dataAttr = ` data-hiragana="${kanjiMap[char]}"`;
                    }
                }
                
                if (className) {
                    html += `<span class="${className}"${dataAttr}>${char}</span>`;
                } else {
                    html += char;
                }
            }
            return html;
        }
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function generateOptions(correctPhrase) {
            const options = [correctPhrase.english];
            const allOptions = quizData.phrases.map(p => p.english);
            
            while (options.length < 4) {
                const random = allOptions[Math.floor(Math.random() * allOptions.length)];
                if (!options.includes(random)) {
                    options.push(random);
                }
            }
            
            return options.sort(() => Math.random() - 0.5);
        }
        
        function initQuestion() {
            currentPhrase = shuffledPhrases[currentIndex];
            answered = false;
            
            const displayText = currentPhrase.display || currentPhrase.hiragana;
            const kanjiMap = currentPhrase.kanji || {};
            document.getElementById('phrase').innerHTML = colorCodeKana(displayText, kanjiMap);
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            
            const progressPercent = ((currentIndex + 1) / shuffledPhrases.length) * 100;
            document.getElementById('progress-fill').style.width = progressPercent + '%';
            document.getElementById('progress-text').textContent = (currentIndex + 1) + '/' + shuffledPhrases.length;
            
            const options = generateOptions(currentPhrase);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, btn);
                btn.disabled = answered;
                container.appendChild(btn);
            });
            
            updateScore();
        }
        
        function checkAnswer(selected, btn) {
            if (answered) return;
            answered = true;
            
            const isCorrect = selected === currentPhrase.english;
            
            if (isCorrect) {
                score.correct++;
                btn.classList.add('correct');
                document.getElementById('feedback').textContent = 'Correct!';
                document.getElementById('feedback').className = 'feedback correct-msg';
            } else {
                score.incorrect++;
                btn.classList.add('incorrect');
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(b => {
                    if (b.textContent === currentPhrase.english) {
                        b.classList.add('correct');
                    }
                });
                document.getElementById('feedback').textContent = `Incorrect. The answer is "${currentPhrase.english}"`;
                document.getElementById('feedback').className = 'feedback incorrect-msg';
            }
            
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            updateScore();
        }
        
        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= shuffledPhrases.length) {
                currentIndex = 0;
                shuffledPhrases = shuffleArray(quizData.phrases);
            }
            initQuestion();
        }
        
        function resetQuiz() {
            score = { correct: 0, incorrect: 0 };
            currentIndex = 0;
            shuffledPhrases = shuffleArray(quizData.phrases);
            initQuestion();
        }
        
        function updateScore() {
            document.getElementById('correct-score').textContent = score.correct;
            document.getElementById('incorrect-score').textContent = score.incorrect;
            
            const total = score.correct + score.incorrect;
            if (total > 0) {
                const accuracy = Math.round((score.correct / total) * 100);
                document.getElementById('accuracy-score').textContent = accuracy + '%';
            } else {
                document.getElementById('accuracy-score').textContent = '—';
            }
        }
        
        async function loadQuiz() {
            try {
                const file = getMovieFile();
                console.log('Loading quiz file:', file);
                
                // Try to load the file with a timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch(file, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Failed to load ${file}`);
                }
                
                quizData = await response.json();
                console.log('Quiz data loaded successfully:', quizData);
                
                document.getElementById('movie-title').textContent = quizData.title;
                document.getElementById('loading-section').style.display = 'none';
                document.getElementById('quiz-section').style.display = 'block';
                
                shuffledPhrases = shuffleArray(quizData.phrases);
                initQuestion();
            } catch (error) {
                console.error('Error loading quiz:', error);
                document.getElementById('loading-section').style.display = 'none';
                document.getElementById('error-section').style.display = 'block';
                const errorMsg = error.name === 'AbortError' 
                    ? 'Timeout: took too long to load the quiz file' 
                    : error.message;
                document.getElementById('error-section').textContent = `Error: ${errorMsg}`;
            }
        }
        
        loadQuiz();
    </script>
</body>
</html>
