<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consonant Family Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 2rem;
            line-height: 1.6;
        }
        
        .quiz-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        
        .filters-container {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #ddd;
        }
        
        .filter-row {
            margin-bottom: 1rem;
        }
        
        .filter-row:last-child {
            margin-bottom: 0;
        }
        
        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .script-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .script-btn {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .script-btn:hover {
            border-color: #999;
        }
        
        .script-btn.active {
            background: #6366f1;
            border-color: #6366f1;
            color: white;
        }
        
        .mode-section {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #ddd;
        }
        
        .mode-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .consonant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
        }
        
        .consonant-btn {
            padding: 12px 8px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            transition: all 0.2s;
        }
        
        .consonant-btn:hover {
            border-color: #999;
        }
        
        .consonant-btn.selected {
            background: #8b5cf6;
            border-color: #8b5cf6;
            color: white;
        }
        
        .score-display {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        
        .score-card {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        .score-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .score-number {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }
        
        .progress-section {
            margin-bottom: 1.5rem;
        }
        
        .progress-bar {
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .quiz-section {
            display: none;
        }
        
        .quiz-section.active {
            display: block;
        }
        
        .question-display {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        
        .question-content {
            text-align: center;
        }
        
        .character-display-both {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
            justify-items: center;
            margin-bottom: 1rem;
        }
        
        .character-column {
            text-align: center;
        }
        
        .character-column-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .character-symbol {
            font-size: 72px;
            font-weight: 500;
            color: #333;
        }
        
        .character-display-single {
            text-align: center;
        }
        
        .question-character {
            font-size: 72px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .question-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .consonant-family-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 12px;
        }
        
        .question-character {
            font-size: 72px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .feedback {
            text-align: center;
            height: 24px;
            margin-bottom: 1rem;
            font-size: 14px;
            font-weight: 500;
            min-height: 24px;
        }
        
        .feedback.correct-msg {
            color: #10b981;
        }
        
        .feedback.incorrect-msg {
            color: #ef4444;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        
        .option-btn {
            padding: 12px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .option-btn:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .option-btn.correct {
            background: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }
        
        .option-btn.incorrect {
            background: #fee2e2;
            color: #7f1d1d;
            border-color: #ef4444;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .action-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .action-btns button {
            padding: 10px 24px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .action-btns button:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .action-btns button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Consonant Family Quiz</h1>
        
        <div class="filters-container">
            <div class="filter-row">
                <div class="filter-label">Display Script</div>
                <div class="script-buttons">
                    <button class="script-btn active" onclick="toggleScript('katakana')">Katakana</button>
                    <button class="script-btn active" onclick="toggleScript('hiragana')">Hiragana</button>
                </div>
            </div>
        </div>
        
        <div class="mode-section">
            <div class="mode-title">Select a Consonant Family</div>
            <div class="consonant-grid" id="consonant-grid"></div>
        </div>
        
        <div class="quiz-section active" id="selection-mode">
            <div style="text-align: center; padding: 2rem; color: #999;">
                Click a consonant family above to begin
            </div>
        </div>
        
        <div class="quiz-section" id="quiz-mode">
            <div class="score-display">
                <div class="score-card">
                    <div class="score-label">Correct</div>
                    <div class="score-number" id="correct-score">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Incorrect</div>
                    <div class="score-number" id="incorrect-score">0</div>
                </div>
                <div class="score-card">
                    <div class="score-label">Accuracy</div>
                    <div class="score-number" id="accuracy-score">—</div>
                </div>
            </div>
            
            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
                <div class="progress-text" id="progress-text">1/5</div>
            </div>
            
            <div class="question-display">
                <div class="question-content">
                    <div class="question-label">Which vowel?</div>
                    <div class="consonant-family-label" id="family-label">ka-family</div>
                    
                    <div id="display-both" class="character-display-both" style="display: none;">
                        <div class="character-column">
                            <div class="character-column-label">Katakana</div>
                            <div class="character-symbol" id="question-char-kata">カ</div>
                        </div>
                        <div class="character-column">
                            <div class="character-column-label">Hiragana</div>
                            <div class="character-symbol" id="question-char-hira">か</div>
                        </div>
                    </div>
                    
                    <div id="display-single" class="character-display-single">
                        <div class="question-character" id="question-char">カ</div>
                    </div>
                </div>
            </div>
            
            <div class="feedback" id="feedback"></div>
            
            <div class="options" id="options-container"></div>
            
            <div class="action-btns">
                <button onclick="nextQuestion()">Next</button>
                <button onclick="backToSelection()">Back</button>
            </div>
        </div>
    </div>
    
    <script>
        const consonantFamilies = {
            'a': { label: 'a-vowels', katakana: ['ア', 'イ', 'ウ', 'エ', 'オ'], hiragana: ['あ', 'い', 'う', 'え', 'お'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'ka': { label: 'ka-family', katakana: ['カ', 'キ', 'ク', 'ケ', 'コ'], hiragana: ['か', 'き', 'く', 'け', 'こ'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'sa': { label: 'sa-family', katakana: ['サ', 'シ', 'ス', 'セ', 'ソ'], hiragana: ['さ', 'し', 'す', 'せ', 'そ'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'ta': { label: 'ta-family', katakana: ['タ', 'チ', 'ツ', 'テ', 'ト'], hiragana: ['た', 'ち', 'つ', 'て', 'と'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'na': { label: 'na-family', katakana: ['ナ', 'ニ', 'ヌ', 'ネ', 'ノ'], hiragana: ['な', 'に', 'ぬ', 'ね', 'の'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'ha': { label: 'ha-family', katakana: ['ハ', 'ヒ', 'フ', 'ヘ', 'ホ'], hiragana: ['は', 'ひ', 'ふ', 'へ', 'ほ'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'ma': { label: 'ma-family', katakana: ['マ', 'ミ', 'ム', 'メ', 'モ'], hiragana: ['ま', 'み', 'む', 'め', 'も'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'ya': { label: 'ya-family', katakana: ['ヤ', 'ユ', 'ヨ'], hiragana: ['や', 'ゆ', 'よ'], vowels: ['a', 'u', 'o'] },
            'ra': { label: 'ra-family', katakana: ['ラ', 'リ', 'ル', 'レ', 'ロ'], hiragana: ['ら', 'り', 'る', 'れ', 'ろ'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'wa': { label: 'wa-family', katakana: ['ワ', 'ヲ', 'ン'], hiragana: ['わ', 'を', 'ん'], vowels: ['a', 'o', 'n'] },
            'ga': { label: 'ga-family', katakana: ['ガ', 'ギ', 'グ', 'ゲ', 'ゴ'], hiragana: ['が', 'ぎ', 'ぐ', 'げ', 'ご'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'za': { label: 'za-family', katakana: ['ザ', 'ジ', 'ズ', 'ゼ', 'ゾ'], hiragana: ['ざ', 'じ', 'ず', 'ぜ', 'ぞ'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'da': { label: 'da-family', katakana: ['ダ', 'ヂ', 'ヅ', 'デ', 'ド'], hiragana: ['だ', 'ぢ', 'づ', 'で', 'ど'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'ba': { label: 'ba-family', katakana: ['バ', 'ビ', 'ブ', 'ベ', 'ボ'], hiragana: ['ば', 'び', 'ぶ', 'べ', 'ぼ'], vowels: ['a', 'i', 'u', 'e', 'o'] },
            'pa': { label: 'pa-family', katakana: ['パ', 'ピ', 'プ', 'ペ', 'ポ'], hiragana: ['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ'], vowels: ['a', 'i', 'u', 'e', 'o'] }
        };
        
        let selectedScripts = new Set(['katakana', 'hiragana']);
        let selectedFamily = null;
        let score = { correct: 0, incorrect: 0 };
        let shuffledIndices = [];
        let currentIndex = 0;
        let answered = false;
        
        function toggleScript(script) {
            if (selectedScripts.has(script)) {
                if (selectedScripts.size > 1) {
                    selectedScripts.delete(script);
                }
            } else {
                selectedScripts.add(script);
            }
            
            const katakanaBtn = document.querySelector('.script-btn:nth-of-type(1)');
            const hiraganaBtn = document.querySelector('.script-btn:nth-of-type(2)');
            
            if (selectedScripts.has('katakana')) {
                katakanaBtn.classList.add('active');
            } else {
                katakanaBtn.classList.remove('active');
            }
            
            if (selectedScripts.has('hiragana')) {
                hiraganaBtn.classList.add('active');
            } else {
                hiraganaBtn.classList.remove('active');
            }
            
            // If in quiz mode, update the display
            if (selectedFamily) {
                initQuestion();
            }
        }
        
        function selectConsonant(key) {
            selectedFamily = key;
            const family = consonantFamilies[key];
            
            // Update button state
            document.querySelectorAll('.consonant-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            // Initialize quiz
            score = { correct: 0, incorrect: 0 };
            shuffledIndices = Array.from({length: family.katakana.length}, (_, i) => i);
            for (let i = shuffledIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
            }
            currentIndex = 0;
            
            // Switch to quiz mode
            document.getElementById('selection-mode').classList.remove('active');
            document.getElementById('quiz-mode').classList.add('active');
            
            initQuestion();
        }
        
        function generateOptions(currentVowel) {
            const family = consonantFamilies[selectedFamily];
            const options = [currentVowel];
            const allVowels = family.vowels;
            
            while (options.length < 4 && options.length < allVowels.length) {
                const random = allVowels[Math.floor(Math.random() * allVowels.length)];
                if (!options.includes(random)) {
                    options.push(random);
                }
            }
            
            return options.sort(() => Math.random() - 0.5);
        }
        
        function initQuestion() {
            const family = consonantFamilies[selectedFamily];
            const idx = shuffledIndices[currentIndex];
            const currentVowel = family.vowels[idx];
            
            answered = false;
            
            document.getElementById('family-label').textContent = family.label;
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            
            // Handle script display
            if (selectedScripts.has('katakana') && selectedScripts.has('hiragana')) {
                // Show both scripts side-by-side
                document.getElementById('display-both').style.display = 'grid';
                document.getElementById('display-single').style.display = 'none';
                document.getElementById('question-char-kata').textContent = family.katakana[idx];
                document.getElementById('question-char-hira').textContent = family.hiragana[idx];
            } else {
                // Show only one script
                document.getElementById('display-both').style.display = 'none';
                document.getElementById('display-single').style.display = 'block';
                if (selectedScripts.has('katakana')) {
                    document.getElementById('question-char').textContent = family.katakana[idx];
                } else {
                    document.getElementById('question-char').textContent = family.hiragana[idx];
                }
            }
            
            const progressPercent = ((currentIndex + 1) / family.katakana.length) * 100;
            document.getElementById('progress-fill').style.width = progressPercent + '%';
            document.getElementById('progress-text').textContent = (currentIndex + 1) + '/' + family.katakana.length;
            
            const options = generateOptions(currentVowel);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, btn, currentVowel);
                btn.disabled = answered;
                container.appendChild(btn);
            });
            
            updateScore();
        }
        
        function checkAnswer(selected, btn, correct) {
            if (answered) return;
            answered = true;
            
            const isCorrect = selected === correct;
            
            if (isCorrect) {
                score.correct++;
                btn.classList.add('correct');
                document.getElementById('feedback').textContent = 'Correct!';
                document.getElementById('feedback').className = 'feedback correct-msg';
            } else {
                score.incorrect++;
                btn.classList.add('incorrect');
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(b => {
                    if (b.textContent === correct) {
                        b.classList.add('correct');
                    }
                });
                document.getElementById('feedback').textContent = `Incorrect. The answer is "${correct}"`;
                document.getElementById('feedback').className = 'feedback incorrect-msg';
            }
            
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            updateScore();
        }
        
        function nextQuestion() {
            const family = consonantFamilies[selectedFamily];
            currentIndex++;
            if (currentIndex >= family.katakana.length) {
                currentIndex = 0;
                shuffledIndices = Array.from({length: family.katakana.length}, (_, i) => i);
                for (let i = shuffledIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
                }
            }
            initQuestion();
        }
        
        function backToSelection() {
            document.getElementById('quiz-mode').classList.remove('active');
            document.getElementById('selection-mode').classList.add('active');
            document.querySelectorAll('.consonant-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }
        
        function updateScore() {
            document.getElementById('correct-score').textContent = score.correct;
            document.getElementById('incorrect-score').textContent = score.incorrect;
            
            const total = score.correct + score.incorrect;
            if (total > 0) {
                const accuracy = Math.round((score.correct / total) * 100);
                document.getElementById('accuracy-score').textContent = accuracy + '%';
            } else {
                document.getElementById('accuracy-score').textContent = '—';
            }
        }
        
        // Initialize consonant grid
        function initConsonantGrid() {
            const grid = document.getElementById('consonant-grid');
            Object.keys(consonantFamilies).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'consonant-btn';
                btn.textContent = key.toUpperCase();
                btn.onclick = (e) => selectConsonant(key, e);
                grid.appendChild(btn);
            });
        }
        
        initConsonantGrid();
    </script>
</body>
</html>
