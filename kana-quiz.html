<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katakana/Hiragana Character Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 2rem;
            line-height: 1.6;
        }
        
        .quiz-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        
        .filters-container {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #ddd;
        }
        
        .filter-row {
            margin-bottom: 1rem;
        }
        
        .filter-row:last-child {
            margin-bottom: 0;
        }
        
        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .script-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .script-btn {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .script-btn:hover {
            border-color: #999;
        }
        
        .script-btn.active {
            background: #6366f1;
            border-color: #6366f1;
            color: white;
        }
        
        .filter-section {
            margin-bottom: 0;
        }
        
        .filter-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .filter-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
        }
        
        .filter-btn {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            border-color: #999;
        }
        
        .filter-btn.active {
            color: white;
            border-color: currentColor;
        }
        
        .filter-btn.vowel-group {
            --color: #3b82f6;
        }
        
        .filter-btn.vowel-group.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        
        .filter-btn.consonant-group {
            --color: #f59e0b;
        }
        
        .filter-btn.consonant-group.active {
            background: #f59e0b;
            border-color: #f59e0b;
        }
        
        .filter-btn.secondary-group {
            --color: #a855f7;
        }
        
        .filter-btn.secondary-group.active {
            background: #a855f7;
            border-color: #a855f7;
        }
        
        .filter-btn.tertiary-group {
            --color: #10b981;
        }
        
        .filter-btn.tertiary-group.active {
            background: #10b981;
            border-color: #10b981;
        }
        
        .filter-btn.phrase-group {
            --color: #ef4444;
        }
        
        .filter-btn.phrase-group.active {
            background: #ef4444;
            border-color: #ef4444;
        }
        
        .score-display {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        
        .score-card {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        .score-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .score-number {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }
        
        .progress-section {
            margin-bottom: 1.5rem;
        }
        
        .progress-bar {
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .character-display {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
            justify-items: center;
        }
        
        .character-column {
            text-align: center;
        }
        
        .character-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .character-symbol {
            font-size: 60px;
            font-weight: 500;
            color: #333;
        }
        
        .feedback {
            text-align: center;
            height: 24px;
            margin-bottom: 1rem;
            font-size: 14px;
            font-weight: 500;
            min-height: 24px;
        }
        
        .feedback.correct-msg {
            color: #10b981;
        }
        
        .feedback.incorrect-msg {
            color: #ef4444;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }
        
        .option-btn {
            padding: 12px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .option-btn:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .option-btn.correct {
            background: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }
        
        .option-btn.incorrect {
            background: #fee2e2;
            color: #7f1d1d;
            border-color: #ef4444;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .action-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .action-btns button {
            padding: 10px 24px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        
        .action-btns button:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .action-btns button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Katakana/Hiragana Character Quiz</h1>
        
        <div class="filters-container">
            <div class="filter-row">
                <div class="filter-label">Display Script</div>
                <div class="script-buttons">
                    <button class="script-btn active" onclick="toggleScript('katakana')">Katakana</button>
                    <button class="script-btn active" onclick="toggleScript('hiragana')">Hiragana</button>
                </div>
            </div>
            
            <div class="filter-row filter-section">
                <div class="filter-label">Character Sets</div>
                <div class="filter-buttons">
                    <button class="filter-btn vowel-group active" data-group="vowels" onclick="toggleGroup('vowels')">Vowels (5)</button>
                    <button class="filter-btn consonant-group active" data-group="consonants" onclick="toggleGroup('consonants')">1st Syllables (3)</button>
                    <button class="filter-btn secondary-group active" data-group="secondary" onclick="toggleGroup('secondary')">2nd Syllables (9)</button>
                    <button class="filter-btn tertiary-group active" data-group="tertiary" onclick="toggleGroup('tertiary')">3rd Syllables (1)</button>
                    <button class="filter-btn phrase-group active" data-group="phrases" onclick="toggleGroup('phrases')">Phrase Words (7)</button>
                </div>
            </div>
        </div>
        
        <div class="score-display">
            <div class="score-card">
                <div class="score-label">Correct</div>
                <div class="score-number" id="correct-score">0</div>
            </div>
            <div class="score-card">
                <div class="score-label">Incorrect</div>
                <div class="score-number" id="incorrect-score">0</div>
            </div>
            <div class="score-card">
                <div class="score-label">Accuracy</div>
                <div class="score-number" id="accuracy-score">—</div>
            </div>
        </div>
        
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
            </div>
            <div class="progress-text" id="progress-text">1/25</div>
        </div>
        
        <div class="character-display">
            <div class="character-column">
                <div class="character-label">Katakana</div>
                <div class="character-symbol" id="katakana">ア</div>
            </div>
            <div class="character-column">
                <div class="character-label">Hiragana</div>
                <div class="character-symbol" id="hiragana">あ</div>
            </div>
        </div>
        
        <div class="feedback" id="feedback"></div>
        
        <div class="options" id="options-container"></div>
        
        <div class="action-btns">
            <button onclick="nextQuestion()">Next question</button>
            <button onclick="resetQuiz()">Reset</button>
        </div>
    </div>
    
    <script>
        const allCharacters = [
            { katakana: 'ア', hiragana: 'あ', romaji: 'a', mnemonic: 'Arch', group: 'vowels' },
            { katakana: 'イ', hiragana: 'い', romaji: 'i', mnemonic: 'Needles', group: 'vowels' },
            { katakana: 'ウ', hiragana: 'う', romaji: 'u', mnemonic: 'Umbrella', group: 'vowels' },
            { katakana: 'エ', hiragana: 'え', romaji: 'e', mnemonic: 'E-shape', group: 'vowels' },
            { katakana: 'オ', hiragana: 'お', romaji: 'o', mnemonic: 'Circle', group: 'vowels' },
            { katakana: 'ナ', hiragana: 'な', romaji: 'na', mnemonic: 'Crossroads', group: 'consonants' },
            { katakana: 'ダ', hiragana: 'だ', romaji: 'da', mnemonic: 'Dot adds voice', group: 'consonants' },
            { katakana: 'ド', hiragana: 'ど', romaji: 'do', mnemonic: 'Door', group: 'consonants' },
            { katakana: 'ニ', hiragana: 'に', romaji: 'ni', mnemonic: 'Twin peaks', group: 'secondary' },
            { katakana: 'ン', hiragana: 'ん', romaji: 'n', mnemonic: 'Note symbol', group: 'secondary' },
            { katakana: 'レ', hiragana: 'れ', romaji: 're', mnemonic: 'Ray of light', group: 'secondary' },
            { katakana: 'コ', hiragana: 'こ', romaji: 'ko', mnemonic: 'Corner box', group: 'secondary' },
            { katakana: 'ツ', hiragana: 'つ', romaji: 'tsu', mnemonic: 'Trident', group: 'secondary' },
            { katakana: 'ゼ', hiragana: 'ぜ', romaji: 'ze', mnemonic: 'Zigzag', group: 'secondary' },
            { katakana: 'チ', hiragana: 'ち', romaji: 'chi', mnemonic: 'Checkerboard', group: 'secondary' },
            { katakana: 'ク', hiragana: 'く', romaji: 'ku', mnemonic: 'Hook', group: 'secondary' },
            { katakana: 'ノ', hiragana: 'の', romaji: 'no', mnemonic: 'Single stroke', group: 'secondary' },
            { katakana: 'ラ', hiragana: 'ら', romaji: 'ra', mnemonic: 'Lasso', group: 'tertiary' },
            { katakana: 'ジ', hiragana: 'じ', romaji: 'ji', mnemonic: 'Spiral', group: 'phrases' },
            { katakana: 'ト', hiragana: 'と', romaji: 'to', mnemonic: 'Totem pole', group: 'phrases' },
            { katakana: 'デ', hiragana: 'で', romaji: 'de', mnemonic: 'Delta wings', group: 'phrases' },
            { katakana: 'ル', hiragana: 'る', romaji: 'ru', mnemonic: 'Boot', group: 'phrases' },
            { katakana: 'マ', hiragana: 'ま', romaji: 'ma', mnemonic: 'Mountains', group: 'phrases' },
            { katakana: 'キ', hiragana: 'き', romaji: 'ki', mnemonic: 'Key', group: 'phrases' },
            { katakana: 'モ', hiragana: 'も', romaji: 'mo', mnemonic: 'House', group: 'phrases' }
        ];
        
        let score = { correct: 0, incorrect: 0 };
        let selectedGroups = new Set(['vowels', 'consonants', 'secondary', 'tertiary', 'phrases']);
        let selectedScripts = new Set(['katakana', 'hiragana']);
        let shuffledCharacters = [];
        let currentIndex = 0;
        let currentChar = null;
        let answered = false;
        
        function toggleScript(script) {
            // Toggle the script, but don't allow turning both off
            if (selectedScripts.has(script)) {
                // Only turn off if the other script is on
                if (selectedScripts.size > 1) {
                    selectedScripts.delete(script);
                }
            } else {
                selectedScripts.add(script);
            }
            
            // Update button styling
            const katakanaBtn = document.querySelector('.script-btn:nth-of-type(1)');
            const hiraganaBtn = document.querySelector('.script-btn:nth-of-type(2)');
            
            if (selectedScripts.has('katakana')) {
                katakanaBtn.classList.add('active');
            } else {
                katakanaBtn.classList.remove('active');
            }
            
            if (selectedScripts.has('hiragana')) {
                hiraganaBtn.classList.add('active');
            } else {
                hiraganaBtn.classList.remove('active');
            }
            
            // Restart quiz with new filter
            resetQuiz();
        }
        
        function toggleGroup(group) {
            if (selectedGroups.has(group)) {
                if (selectedGroups.size > 1) {
                    selectedGroups.delete(group);
                }
            } else {
                selectedGroups.add(group);
            }
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const btnGroup = btn.getAttribute('data-group');
                if (selectedGroups.has(btnGroup)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            resetQuiz();
        }
        
        function shuffleArray(array) {
            const filtered = array.filter(char => selectedGroups.has(char.group));
            const shuffled = [...filtered];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function generateOptions(correctChar) {
            const options = [correctChar.romaji];
            const allOptions = allCharacters.map(c => c.romaji);
            
            while (options.length < 4) {
                const random = allOptions[Math.floor(Math.random() * allOptions.length)];
                if (!options.includes(random)) {
                    options.push(random);
                }
            }
            
            return options.sort(() => Math.random() - 0.5);
        }
        
        function initQuestion() {
            currentChar = shuffledCharacters[currentIndex];
            answered = false;
            
            // Hide/show columns based on selected scripts
            const katakanaColumn = document.querySelector('.character-column:nth-of-type(1)');
            const hiraganaColumn = document.querySelector('.character-column:nth-of-type(2)');
            const displayContainer = document.querySelector('.character-display');
            
            const showKatakana = selectedScripts.has('katakana');
            const showHiragana = selectedScripts.has('hiragana');
            
            if (showKatakana) {
                katakanaColumn.style.display = 'block';
                document.getElementById('katakana').textContent = currentChar.katakana;
            } else {
                katakanaColumn.style.display = 'none';
            }
            
            if (showHiragana) {
                hiraganaColumn.style.display = 'block';
                document.getElementById('hiragana').textContent = currentChar.hiragana;
            } else {
                hiraganaColumn.style.display = 'none';
            }
            
            // Adjust grid columns based on what's visible
            if (showKatakana && showHiragana) {
                displayContainer.style.gridTemplateColumns = '1fr 1fr';
            } else {
                displayContainer.style.gridTemplateColumns = '1fr';
            }
            
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            
            const totalChars = shuffledCharacters.length;
            const progressPercent = ((currentIndex + 1) / totalChars) * 100;
            document.getElementById('progress-fill').style.width = progressPercent + '%';
            document.getElementById('progress-text').textContent = (currentIndex + 1) + '/' + totalChars;
            
            const options = generateOptions(currentChar);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, btn);
                btn.disabled = answered;
                container.appendChild(btn);
            });
            
            updateScore();
        }
        
        function checkAnswer(selected, btn) {
            if (answered) return;
            answered = true;
            
            const isCorrect = selected === currentChar.romaji;
            
            if (isCorrect) {
                score.correct++;
                btn.classList.add('correct');
                document.getElementById('feedback').textContent = 'Correct! (' + currentChar.mnemonic + ')';
                document.getElementById('feedback').className = 'feedback correct-msg';
            } else {
                score.incorrect++;
                btn.classList.add('incorrect');
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(b => {
                    if (b.textContent === currentChar.romaji) {
                        b.classList.add('correct');
                    }
                });
                document.getElementById('feedback').textContent = `Incorrect. The answer is "${currentChar.romaji}" (${currentChar.mnemonic})`;
                document.getElementById('feedback').className = 'feedback incorrect-msg';
            }
            
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            updateScore();
        }
        
        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= shuffledCharacters.length) {
                currentIndex = 0;
                shuffledCharacters = shuffleArray(allCharacters);
            }
            initQuestion();
        }
        
        function resetQuiz() {
            score = { correct: 0, incorrect: 0 };
            currentIndex = 0;
            shuffledCharacters = shuffleArray(allCharacters);
            initQuestion();
        }
        
        function updateScore() {
            document.getElementById('correct-score').textContent = score.correct;
            document.getElementById('incorrect-score').textContent = score.incorrect;
            
            const total = score.correct + score.incorrect;
            if (total > 0) {
                const accuracy = Math.round((score.correct / total) * 100);
                document.getElementById('accuracy-score').textContent = accuracy + '%';
            } else {
                document.getElementById('accuracy-score').textContent = '—';
            }
        }
        
        shuffledCharacters = shuffleArray(allCharacters);
        initQuestion();
    </script>
</body>
</html>
